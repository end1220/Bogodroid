[paths]

game_files="/gamefiles/skul"
support_files="/gamefiles/skul"

android_package_code="/gamefiles/skul"
android_external_files="/gamefiles/skul_external"
android_files="/gamefiles/skul_internal"
android_data="/gamefiles/skul_data"
android_obb_dirs=["/gamefiles/skul_obb"]
android_source_dirs=["/gamefiles/skul_src"]
android_cache="/gamefiles/skul_cache"


[package]

packageName="com.playdigious.skul"
versionName="1.0.6"
mainIntentBundle = {}


[device]

displayWidth=640
displayHeight=480
displayRotation=0
displayDpi=320
displayRefreshRate=60


[audio]
backend = "auto"


[unity]
block_analytics = true

[debug]
# Process RSS sample every N ms during eglSwapBuffers (0 = off).
mem_log_interval_ms = 2000

[gpu]
# 1 GB handheld: RGBA8 runtime box-downsample. ETC2/ASTC still need offline
# retier via tools/unity_astc (compressed upload is not intercepted at runtime).
textureMaxDim = 384

# Archived Skul PAD layout (port stopped). Enable only to replay the case study.
[play_asset_delivery]
enabled = true
default_pack = "CustomFastFollow"
pack_version = "48"
pack_path_template = "assetpacks/{pack}/{ver}/{ver}/assets"

# Skul port stopped (OOM at gameBase). Keep plugin for reference; leave disabled
# unless deliberately replaying the archived port.
[game_patches.skul_pad]
enabled = false
direct_title_scene = false
