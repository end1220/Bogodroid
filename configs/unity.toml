[paths]

game_files="../gamefiles/unitytest/"
support_files="../gamefiles/support_files/"

android_package_code="/fakepath_package_code"
android_external_files="/fakepath_external_files"
android_files="/fakepath_files"
android_obb_dirs=["/fakepath_obb"]
android_source_dirs=["/fakepath_source"]


[package]

packageName="com.example.package"
versionName="0.1"
mainIntentBundle = { unity = "-forcegles20" }


[device]

displayWidth=640
displayHeight=480
displayRotation=0


[audio]
# auto | sysfs | software | passthrough
backend = "auto"
# sysfs_path = "/sys/class/power_supply/axp2202-battery/openbor_volume"
# sysfs_max = 10
# intercept_volume_keys = "auto"

# [input]
# controller_name = "Xbox 360 Controller"
# dpad_synthesize_hat = false

