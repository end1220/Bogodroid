[paths]

# BrickGamePro (Unity 2018.2 IL2CPP) - container / handheld port layout.
game_files="./game/"
support_files="./game/"

android_package_code="./game/"
android_external_files="./conf/"
android_files="./conf/"
android_cache="./cache/"
android_obb_dirs=["./game/"]
android_source_dirs=["./game/"]


[package]

packageName="com.perseusgames.brickgamepro"
versionName="0.1"
mainIntentBundle = { unity = "-force-gles20" }


[device]

displayWidth=0
displayHeight=0
displayRefreshRate=60
displayRotation=0
displayTouchscreen=1
language="en"
country="US"


[input]

controller=true
controller_name="Microsoft X-Box 360 pad"
touch_mode=true
dpad_synthesize_hat=false
controller_key_events=false

[game_patches.brickgamepro]
enabled=true

[game_patches.brickgamepro.touch]
enabled=true
design_width=640.0
design_height=480.0

[game_patches.brickgamepro.touch.dpleft]
x=222.0
y=375.0

[game_patches.brickgamepro.touch.dpright]
x=300.0
y=375.0

[game_patches.brickgamepro.touch.dpup]
x=260.0
y=335.0

[game_patches.brickgamepro.touch.dpdown]
x=260.0
y=414.0

[game_patches.brickgamepro.touch.a]
x=393.0
y=377.0

[game_patches.brickgamepro.touch.b]
x=334.0
y=307.0

[game_patches.brickgamepro.touch.x]
x=367.0
y=307.0

[game_patches.brickgamepro.touch.y]
x=400.0
y=307.0

[game_patches.brickgamepro.touch.start]
x=433.0
y=307.0

[game_patches.brickgamepro.viewport]
enabled=true
renderScale=2.0
anchor="top"
offsetY=-96


[unity]

version = "il2cpp"
block_analytics = true


[google_play]

offline = true


[audio]

backend = "dummy"


[video]

path = "yuv_gpu"
color_matrix = "auto"
color_range = "auto"


[gpu]

textureMaxDim = 0
