[paths]

# BrickGamePro (Unity 2018.2 IL2CPP) - container / handheld port layout.
game_files="./game/"
support_files="./game/"

# init_config changes cwd to game_files; Android paths below are relative to game/.
android_package_code="./"
android_external_files="../conf/"
android_files="../conf/"
android_cache="../cache/"
android_obb_dirs=["./"]
android_source_dirs=["./"]


[package]

packageName="com.perseusgames.brickgamepro"
versionName="0.1"
mainIntentBundle = { unity = "-force-gles20" }


[device]

displayWidth=0
displayHeight=0
displayRefreshRate=0
displayRotation=0
displayTouchscreen=1
language="en"
country="US"


[input]

controller=true
controller_name="Microsoft X-Box 360 pad"
touch_mode=true
dpad_synthesize_hat=false
controller_key_events=false

[unity]

version = "il2cpp"
block_analytics = true


[google_play]

offline = true


[audio]

backend = "auto"


[video]

path = "yuv_gpu"
color_matrix = "auto"
color_range = "auto"


[gpu]

textureMaxDim = 0
